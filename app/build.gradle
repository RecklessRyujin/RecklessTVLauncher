plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.reckless.tvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.reckless.tvlauncher'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
